server {
    listen 80;
    server_name _;

    location /results/ {
        alias /usr/share/nginx/html/results/;
        autoindex on;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}